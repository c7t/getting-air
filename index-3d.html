<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>getting-air — dense 3D LBM (D3Q19 / D3Q27)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111; color: #eee; font-family: monospace;
      overflow: hidden; display: flex; flex-direction: column; height: 100dvh;
    }
    #canvas-container {
      flex: 1; position: relative; display: flex; align-items: center;
      justify-content: center; background: #000; overflow: hidden; container-type: size;
    }
    /* Aspect ratio is set from JS to the SLICE's in-plane extent, not fixed
       square: the sphere scenario's domain is 192x128x128, and letting a
       square canvas stretch it renders a sphere as an ellipse -- which reads
       as a geometry bug in a page whose whole job is showing geometry. */
    canvas { display: block; width: 100cqw; height: auto; max-height: 100cqh; }
    #status {
      position: absolute; top: 8px; left: 8px; font-size: 12px; color: #7f7;
      background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 3px;
      pointer-events: none; white-space: pre;
    }
    #controls {
      flex-shrink: 0; background: rgba(0,0,0,0.85); padding: 10px 12px;
      display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #444;
    }
    .control-row { display: flex; align-items: center; gap: 10px; }
    .control-row label { width: 92px; font-size: 11px; color: #aaa; }
    .control-row input[type=range] { flex-grow: 1; cursor: pointer; }
    .control-row span.val { width: 56px; text-align: right; font-size: 11px; color: #fff; }
    select, button {
      font-family: monospace; font-size: 11px; background: #222; color: #eee;
      border: 1px solid #555; padding: 3px 8px; border-radius: 3px; cursor: pointer;
    }
    .hint { font-size: 11px; color: #888; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="c"></canvas>
    <div id="status">initializing...</div>
  </div>

  <div id="controls">
    <div class="control-row">
      <label for="slider-SLICE">slice</label>
      <input type="range" id="slider-SLICE" min="0" max="63" step="1" value="0">
      <span class="val" id="val-SLICE">0</span>
    </div>
    <div class="control-row">
      <label for="sel-AXIS">normal</label>
      <select id="sel-AXIS">
        <option value="0">x</option>
        <option value="1">y</option>
        <option value="2" selected>z</option>
      </select>
      <label for="sel-MODE" style="width:auto">field</label>
      <select id="sel-MODE">
        <option value="0">speed</option>
        <option value="1" selected>vorticity (out of plane)</option>
        <option value="2">velocity along normal</option>
      </select>
      <button id="btn-PLAY">pause</button>
      <button id="btn-RESET">reset</button>
      <span class="hint" id="hint">?scenario=beltrami|duct|tgv &nbsp; ?n= ?q=19|27 ?tau= ?u0=</span>
    </div>
  </div>

  <script type="module" src="main-3d.js"></script>
</body>
</html>
