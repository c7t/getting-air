<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>getting-air (AMR dev)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    #canvas-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
      container-type: size; /* enable cqw/cqh inside */
    }
    canvas {
      display: block;
      width:  min(100cqw, 100cqh);
      height: min(100cqw, 100cqh);
    }
    #status {
      position: absolute; top: 8px; left: 8px;
      font-size: 12px; color: #7f7; background: rgba(0,0,0,0.6);
      padding: 4px 8px; border-radius: 3px; pointer-events: none;
    }
    #perf {
      position: absolute; top: 40px; left: 8px;
      font-size: 11px; color: #0cf; background: rgba(0,0,0,0.6);
      padding: 4px 8px; border-radius: 3px; pointer-events: none;
      display: flex; flex-direction: column; gap: 2px;
    }
    .perf-label { color: #888; margin-right: 4px; }
    #download {
      position: absolute; top: 8px; right: 8px;
      font-size: 12px; color: #eee; background: rgba(0,0,0,0.6);
      padding: 4px 8px; border: 1px solid #555; border-radius: 3px;
      cursor: pointer; font-family: monospace;
    }
    #download:hover { background: rgba(50,50,50,0.8); }
    #debug-panel {
      position: absolute; top: 40px; right: 8px;
      display: none; flex-direction: column; gap: 4px; align-items: stretch;
      width: 132px;
      background: rgba(0,0,0,0.6); padding: 6px; border: 1px solid #555;
      border-radius: 3px; font-size: 12px; color: #eee;
    }
    #debug-panel button {
      font: inherit; color: #eee; background: rgba(30,30,30,0.9);
      border: 1px solid #555; border-radius: 3px; padding: 3px 6px; cursor: pointer;
      white-space: nowrap; overflow: hidden;
    }
    #debug-panel button:hover { background: rgba(70,70,70,0.9); }
    .dbg-steprow { display: flex; gap: 4px; }
    .dbg-steprow button { flex: 1; }
    #dbg-stepn {
      width: 48px; font: inherit; color: #eee; background: rgba(20,20,20,0.9);
      border: 1px solid #555; border-radius: 3px; text-align: right;
    }
    #dbg-stat { color: #7f7; text-align: center; font-size: 11px; }
    #controls {
      flex-shrink: 0;
      background: rgba(0,0,0,0.85);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #444;
    }
    .control-row { display: flex; align-items: center; gap: 10px; }
    .control-row label { width: 100px; font-size: 11px; color: #aaa; }
    .control-row input { flex-grow: 1; cursor: pointer; }
    .control-row span { width: 50px; text-align: right; font-size: 11px; color: #fff; }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="c"></canvas>
    <div id="status">initializing...</div>
    <div id="perf">
      <div><span class="perf-label">MLUPS:</span> <span id="val-mlups">0.0</span></div>
      <div><span class="perf-label">GPU:</span> <span id="val-gpu-ms">0.0</span> ms</div>
      <div><span class="perf-label">SYNC:</span> <span id="val-sync-ms">0.0</span> ms</div>
    </div>
    <button id="download">Download CSV</button>
    <div id="debug-panel">
      <button id="dbg-pause">Pause</button>
      <div class="dbg-steprow">
        <button id="dbg-step">Step</button>
        <input id="dbg-stepn" type="number" min="1" value="1" title="macro-steps">
      </div>
      <button id="dbg-snapshot">Snapshot</button>
      <button id="dbg-reset">Reset</button>
      <div id="dbg-stat">–</div>
    </div>
  </div>

  <div id="controls">
    <div class="control-row">
      <label>Resolution</label>
      <input type="range" id="slider-RES" min="6" max="11" step="1" value="10">
      <span id="val-RES">1024</span>
    </div>
    <div class="control-row">
      <label>A (semi-major)</label>
      <input type="range" id="slider-A" min="10" max="128" step="1" value="32">
      <span id="val-A">32</span>
    </div>
    <div class="control-row">
      <label>B (semi-minor)</label>
      <input type="range" id="slider-B" min="2" max="32" step="1" value="4">
      <span id="val-B">4</span>
    </div>
    <div class="control-row">
      <label>I* (inertia)</label>
      <input type="range" id="slider-I_STAR" min="0.05" max="1.0" step="0.01" value="0.34">
      <span id="val-I_STAR">0.34</span>
    </div>
    <div class="control-row">
      <label>τ (viscosity)</label>
      <input type="range" id="slider-TAU" min="0.501" max="0.6" step="0.001" value="0.509">
      <span id="val-TAU">0.509</span>
    </div>
    <div class="control-row">
      <label>Ut (gravity)</label>
      <input type="range" id="slider-U_T" min="0.01" max="0.15" step="0.005" value="0.05">
      <span id="val-U_T">0.05</span>
    </div>
    <div class="control-row">
      <label>Refinement overlay</label>
      <input type="range" id="slider-overlay" min="0" max="1" step="0.05" value="1">
      <span id="val-overlay">1.00</span>
    </div>
    <div class="control-row">
      <label>Quad outlines</label>
      <input type="range" id="slider-outline" min="0" max="1" step="0.05" value="0">
      <span id="val-outline">0.00</span>
    </div>
  </div>

  <script type="module" src="main-amr.js"></script>
</body>
</html>
