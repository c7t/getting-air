<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>getting-air</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: monospace; overflow: hidden; }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    #status {
      position: absolute; top: 8px; left: 8px;
      font-size: 12px; color: #7f7; background: rgba(0,0,0,0.6);
      padding: 4px 8px; border-radius: 3px; pointer-events: none;
    }
    #download {
      position: absolute; top: 8px; right: 8px;
      font-size: 12px; color: #eee; background: rgba(0,0,0,0.6);
      padding: 4px 8px; border: 1px solid #555; border-radius: 3px;
      cursor: pointer; font-family: monospace;
    }
    #download:hover { background: rgba(50,50,50,0.8); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="status">initializing...</div>
  <button id="download">Download CSV</button>
  <script type="module" src="main.js"></script>
</body>
</html>
